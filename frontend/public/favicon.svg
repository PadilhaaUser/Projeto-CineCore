<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#141414" />
  
  <!-- Orbital rings for the 'Core' aspect -->
  <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="url(#grad)" stroke-width="4" transform="rotate(45 50 50)" />
  <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="url(#grad)" stroke-width="4" transform="rotate(-45 50 50)" />
  
  <!-- Play button / Core in the center -->
  <polygon points="43,38 43,62 62,50" fill="#E50914"/>
  <circle cx="50" cy="50" r="5" fill="#ffffff" opacity="0.9" />
</svg>